
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory Manager</title>
</head>
<body>
    <h1>Product Inventory Manager</h1>

    <form id="productForm">
        <input type="text" id="productName" placeholder="Product Name" required>
        <input type="number" id="productPrice" placeholder="Price" min="0.01" step="0.01" required>
        <input type="number" id="productQuantity" placeholder="Quantity" min="1" step="1" required>
        <button type="submit">Add Product</button>
    </form>

    <h2>Inventory</h2>
    <p>Total Products: <span id="totalProducts">0</span></p>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="inventoryTable"></tbody>
    </table>

    <script src="inventory.js"></script>
</body>
</html>
